name: CI

on:
  push:
    branches:
      - main
      - "build/**"
      - "feature/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Verify standalone Timesheets migrations, permissions and concurrency
        run: |
          mkdir -p build/timesheets-sql-tooling
          printf '{"private":true}' > build/timesheets-sql-tooling/package.json
          npm install --prefix build/timesheets-sql-tooling --no-audit --no-fund --package-lock=false pg@8.23.1
          PG_BIN="$(find /usr/lib/postgresql -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/bin"
          test -x "$PG_BIN/initdb"
          COVIE_TIMESHEETS_PG_BIN="$PG_BIN" COVIE_TIMESHEETS_PG_LIB=/usr/lib/x86_64-linux-gnu COVIE_SQL_TOOLING="$PWD/build/timesheets-sql-tooling" npm run test:timesheets-native

      - name: Save Timesheets SQL qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timesheets-sql-evidence
          retention-days: 3
          path: |
            build/pg-run.*/run.txt
            build/pg-run.*/logs/*.log
            build/pg-run.*/legacy-*.sha

      - name: Dependency audit
        run: node scripts/dependency-audit.mjs

      - name: Save full dependency audit and scoped exception evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          path: build/security-audit/*.json
          retention-days: 3

      - name: Build
        run: npm run build
        env:
          NEON_AUTH_BASE_URL: https://build-only.invalid/auth
          NEON_AUTH_COOKIE_SECRET: build-only-cookie-secret-not-for-runtime

  personal-calendar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Install isolated browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1 esbuild@0.25.12
      - run: npx playwright install --with-deps chromium
      - name: Verify My calendars on desktop and mobile
        run: node tests/browser/my-calendars/run.mjs
      - name: Verify owner setup and booking sharing on desktop and mobile
        run: node tests/browser/owner-readiness/run.mjs
      - name: Verify standalone Timesheets on desktop and mobile
        run: node tests/browser/timesheets/run.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-calendars-browser-evidence
          retention-days: 3
          path: |
            test-results/my-calendars/*.png
            test-results/my-calendars/results.json
            test-results/owner-readiness/*.png
            test-results/owner-readiness/*.json
            test-results/owner-readiness/failure-*.html
            test-results/timesheets/*.png
            test-results/timesheets/*.json
            test-results/timesheets/failure-*.html
