name: CI

on:
  push:
    branches:
      - main
      - "build/**"
      - "feature/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEON_AUTH_BASE_URL: https://build-only.invalid/auth
          NEON_AUTH_COOKIE_SECRET: build-only-cookie-secret-not-for-runtime
