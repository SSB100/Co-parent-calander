name: Staff Rosters diagnostic

on:
  pull_request:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee tests.log
      - name: Audit
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee audit.log
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        env:
          NEON_AUTH_BASE_URL: https://build-only.invalid/auth
          NEON_AUTH_COOKIE_SECRET: build-only-cookie-secret-not-for-runtime
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-rosters-diagnostic
          path: |
            lint.log
            typecheck.log
            tests.log
            audit.log
            build.log
      - name: Fail if any gate failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
